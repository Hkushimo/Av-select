name: Verify AV Select
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test scheduling and database billing rules
        run: npm test
      - name: Build Next.js and package the Cloudflare Worker
        run: npm run build
      - name: Validate the deployable Wrangler bundle without uploading
        run: npx wrangler deploy --dry-run
